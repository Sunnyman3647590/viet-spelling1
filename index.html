<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <link rel="manifest" href="manifest.json">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>越南语拼读 · 离线版</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: -apple-system, 'Segoe UI', Roboto, sans-serif; }
        body { background: #f0f4f8; padding: 12px; padding-bottom: 100px; }
        .app-header { background: linear-gradient(135deg, #1a73e8, #0d47a1); color: white; padding: 16px 20px; border-radius: 16px; margin-bottom: 16px; box-shadow: 0 4px 12px rgba(26, 115, 232, 0.3); }
        .app-header h1 { font-size: 22px; font-weight: 600; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
        .app-header p { font-size: 13px; opacity: 0.85; margin-top: 4px; }
        .app-header .tts-badge { background: rgba(255,255,255,0.2); padding: 2px 12px; border-radius: 20px; font-size: 11px; font-weight: 500; display: inline-block; margin-top: 6px; }
        .offline-badge { background: #4caf50; color: white; font-size: 11px; padding: 2px 10px; border-radius: 20px; margin-left: 8px; }
        .search-box { background: white; border-radius: 14px; padding: 12px 16px; margin-bottom: 16px; box-shadow: 0 2px 8px rgba(0,0,0,0.06); display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
        .search-box input { flex: 1; min-width: 150px; padding: 10px 14px; border: 2px solid #e2e8f0; border-radius: 30px; font-size: 16px; outline: none; transition: 0.2s; background: #f8fafc; }
        .search-box input:focus { border-color: #1a73e8; background: white; }
        .search-box .btn { padding: 10px 20px; border: none; border-radius: 30px; font-size: 14px; font-weight: 600; cursor: pointer; transition: 0.2s; white-space: nowrap; }
        .btn-primary { background: #1a73e8; color: white; }
        .btn-primary:active { transform: scale(0.96); background: #0d47a1; }
        .btn-outline { background: transparent; color: #1a73e8; border: 2px solid #1a73e8; }
        .btn-outline:active { background: #1a73e8; color: white; }
        .btn-danger { background: #e74c3c; color: white; }
        .btn-danger:active { background: #c0392b; }
        .card { background: white; border-radius: 16px; padding: 16px; margin-bottom: 14px; box-shadow: 0 2px 8px rgba(0,0,0,0.05); }
        .card-title { font-size: 16px; font-weight: 600; color: #1e293b; margin-bottom: 10px; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
        .card-title .badge { font-size: 11px; background: #e2e8f0; padding: 1px 10px; border-radius: 20px; font-weight: 400; color: #475569; }
        .result-area { min-height: 80px; display: flex; flex-direction: column; align-items: center; justify-content: center; background: #f8fafc; border-radius: 12px; padding: 20px; text-align: center; }
        .result-word { font-size: 32px; font-weight: 700; color: #0f172a; }
        .result-spelling { font-size: 20px; color: #1a73e8; margin-top: 6px; font-weight: 500; letter-spacing: 1px; }
        .result-detail { font-size: 14px; color: #64748b; margin-top: 4px; }
        .play-btn { margin-top: 12px; padding: 10px 32px; border: none; border-radius: 30px; background: #1a73e8; color: white; font-size: 16px; font-weight: 600; cursor: pointer; transition: 0.2s; display: inline-flex; align-items: center; gap: 8px; }
        .play-btn:active { transform: scale(0.95); background: #0d47a1; }
        .play-btn:disabled { opacity: 0.5; transform: none; }
        .syllable-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(70px, 1fr)); gap: 8px; margin-top: 8px; }
        .syllable-chip { background: #f1f5f9; padding: 8px 6px; border-radius: 10px; text-align: center; font-size: 16px; font-weight: 500; color: #0f172a; cursor: pointer; transition: 0.2s; border: 2px solid transparent; user-select: none; }
        .syllable-chip:active { transform: scale(0.94); background: #dbeafe; border-color: #1a73e8; }
        .tab-bar { display: flex; gap: 6px; overflow-x: auto; padding: 4px 0; margin-bottom: 12px; flex-wrap: nowrap; }
        .tab-bar .tab-btn { padding: 8px 16px; border: none; border-radius: 30px; font-size: 13px; font-weight: 500; cursor: pointer; white-space: nowrap; background: #e2e8f0; color: #475569; transition: 0.2s; }
        .tab-bar .tab-btn.active { background: #1a73e8; color: white; }
        .tab-bar .tab-btn:active { transform: scale(0.95); }
        .tab-content { display: none; }
        .tab-content.active { display: block; }
        .minimal-pair { display: flex; justify-content: space-between; align-items: center; padding: 10px 12px; border-bottom: 1px solid #f1f5f9; gap: 8px; flex-wrap: wrap; }
        .minimal-pair:last-child { border-bottom: none; }
        .minimal-pair .pair-item { display: flex; align-items: center; gap: 8px; flex: 1; min-width: 100px; }
        .minimal-pair .pair-word { font-size: 18px; font-weight: 600; color: #0f172a; cursor: pointer; }
        .minimal-pair .pair-zh { font-size: 13px; color: #64748b; }
        .minimal-pair .pair-play { background: none; border: none; font-size: 18px; cursor: pointer; padding: 4px 8px; }
        .fav-btn { background: none; border: none; font-size: 20px; cursor: pointer; padding: 0 4px; }
        .footer { text-align: center; padding: 20px 0 10px; font-size: 12px; color: #94a3b8; }
        .toast { position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%); background: #1e293b; color: white; padding: 12px 24px; border-radius: 30px; font-size: 14px; opacity: 0; transition: 0.3s; pointer-events: none; z-index: 999; max-width: 90%; text-align: center; }
        .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
        .status-text { font-size: 12px; opacity: 0.8; margin-top: 2px; }
        .phoneme-section { margin-bottom: 12px; }
        .phoneme-section .section-label { font-size: 14px; font-weight: 600; color: #475569; margin-bottom: 6px; display: flex; align-items: center; gap: 8px; }
        .phoneme-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(55px, 1fr)); gap: 6px; }
        .phoneme-chip { background: #e8edf5; padding: 8px 4px; border-radius: 8px; text-align: center; font-size: 18px; font-weight: 600; color: #0f172a; cursor: pointer; transition: 0.2s; border: 2px solid transparent; user-select: none; }
        .phoneme-chip:active { transform: scale(0.92); background: #dbeafe; border-color: #1a73e8; }
        .phoneme-chip .sub { font-size: 11px; font-weight: 400; color: #94a3b8; display: block; }
        .phoneme-chip .ipa-badge { font-size: 10px; font-weight: 400; color: #e74c3c; display: block; font-family: monospace; }
        @media (max-width: 480px) {
            .app-header h1 { font-size: 18px; }
            .result-word { font-size: 26px; }
            .result-spelling { font-size: 17px; }
            .syllable-grid { grid-template-columns: repeat(auto-fill, minmax(60px, 1fr)); gap: 6px; }
            .syllable-chip { font-size: 14px; padding: 6px 4px; }
            .phoneme-grid { grid-template-columns: repeat(auto-fill, minmax(48px, 1fr)); }
            .phoneme-chip { font-size: 15px; padding: 6px 2px; }
        }
    </style>
</head>
<body>

    <div class="app-header">
        <h1>🇻🇳 越南语拼读 <span class="offline-badge">📴 完全离线</span></h1>
        <p>点击字母或音节 · 听本地发音</p>
        <span class="tts-badge">🔊 内置音频包</span>
        <div class="status-text" id="statusText">⏳ 正在加载音频...</div>
    </div>

    <div class="search-box">
        <input type="text" id="searchInput" placeholder="输入越南语，如 ba, bạn..." />
        <button class="btn btn-primary" id="searchBtn">拼读</button>
        <button class="btn btn-outline" id="randomBtn">🎲 随机</button>
    </div>

    <div class="card">
        <div class="result-area" id="resultArea">
            <div class="result-word" id="resultWord">ba</div>
            <div class="result-spelling" id="resultSpelling">bờ ... a ... ba</div>
            <div class="result-detail" id="resultDetail">辅音: b | 元音: a | 声调: 平声</div>
            <button class="play-btn" id="playBtn">🔊 播放拼读</button>
        </div>
    </div>

    <div class="tab-bar" id="tabBar">
        <button class="tab-btn active" data-tab="tabPhonemes">🔤 字母</button>
        <button class="tab-btn" data-tab="tabConsonantVowel">🔗 拼读</button>
        <button class="tab-btn" data-tab="tabTones">🎵 声调</button>
        <button class="tab-btn" data-tab="tabFinal">📎 后辅音</button>
        <button class="tab-btn" data-tab="tabMinimal">🔍 辨音</button>
        <button class="tab-btn" data-tab="tabFavorites">⭐ 收藏</button>
    </div>

    <div id="tabPhonemes" class="tab-content active">
        <div class="card">
            <div class="card-title">🔤 元音 <span class="badge">12个</span></div>
            <div class="phoneme-grid" id="vowelGrid"></div>
        </div>
        <div class="card">
            <div class="card-title">🔤 辅音 <span class="badge">27个</span></div>
            <div class="phoneme-grid" id="consonantGrid"></div>
        </div>
        <div class="card" style="background:#f8fafc;">
            <div style="font-size:13px; color:#64748b; text-align:center;">
                💡 点击字母播放标准发音 · 点击「拼读」Tab练习组合
            </div>
        </div>
    </div>

    <div id="tabConsonantVowel" class="tab-content">
        <div class="card">
            <div class="card-title">辅音 + 元音 拼读 <span class="badge">基础音节</span></div>
            <div id="cvGrid" class="syllable-grid"></div>
        </div>
    </div>

    <div id="tabTones" class="tab-content">
        <div class="card">
            <div class="card-title">声调练习 <span class="badge">6声</span></div>
            <div id="toneGrid" class="syllable-grid"></div>
        </div>
    </div>

    <div id="tabFinal" class="tab-content">
        <div class="card">
            <div class="card-title">后辅音组合 <span class="badge">-m -p -n -t -nh -ch -ng -c</span></div>
            <div id="finalGrid" class="syllable-grid"></div>
        </div>
    </div>

    <div id="tabMinimal" class="tab-content">
        <div class="card">
            <div class="card-title">辨音练习 <span class="badge">易混淆</span></div>
            <div id="minimalList"></div>
        </div>
    </div>

    <div id="tabFavorites" class="tab-content">
        <div class="card">
            <div class="card-title">⭐ 收藏的音节</div>

            </div>
            <button class="btn btn-danger" id="clearFavBtn" style="margin-top:10px; width:100%;">清空收藏</button>
        </div>
    </div>

    <div class="toast" id="toast"></div>
    <div class="footer">数据本地存储 · 完全离线发音 (内置MP3)</div>

                    'ỡ': '跌声', 'ợ': '重声', 'ú': '锐声', 'ù': '玄声',
                    'ủ': '问声', 'ũ': '跌声', 'ụ': '重声', 'ứ': '锐声',
                    'ừ': '玄声', 'ử': '问声', 'ữ': '跌声', 'ự': '重声',
                    'ý': '锐声', 'ỳ': '玄声', 'ỷ': '问声', 'ỹ': '跌声',
                    'ỵ': '重声'
                };
                this.compoundConsonants = ['ngh', 'ng', 'nh', 'th', 'ph', 'kh', 'gh', 'ch', 'tr', 'gi', 'qu'];
                this.singleConsonants = ['p', 'b', 'm', 'n', 't', 'đ', 'l', 'v', 'h', 's', 'x', 'r', 'c', 'k', 'g', 'd', 'q'];
                this.vowelList = ['ươi', 'ươ', 'uô', 'iê', 'ia', 'ưa', 'ua', 'i', 'y', 'u', 'ư', 'a', 'ă', 'â', 'e', 'ê', 'o', 'ô', 'ơ'];
            }

            parse(syllable) {
                let plain = syllable;
                let toneChar = '';
                for (let i = syllable.length - 1; i >= 0; i--) {
                    const ch = syllable[i];
                    if (this.toneMap[ch]) {
                        toneChar = ch;
                        plain = syllable.slice(0, i) + this.toneMap[ch] + syllable.slice(i + 1);
                        break;
                    }
                }
                let consonant = '';
                let remaining = plain;
                for (const cc of this.compoundConsonants) {
                    if (plain.startsWith(cc)) {
                        consonant = cc;
                        remaining = plain.slice(cc.length);
                        break;
                    }
                }
                if (!consonant) {
                    for (const sc of this.singleConsonants) {
                        if (plain.startsWith(sc)) {
                            consonant = sc;
                            remaining = plain.slice(sc.length);
                            break;
                        }
                    }
                }
                let vowel = '';
                let final = '';
                for (const v of this.vowelList) {
                    if (remaining.startsWith(v)) {
                        vowel = v;
                        final = remaining.slice(v.length);
                        break;
                    }
                }
                if (!vowel && remaining.length > 0) {
                    for (const v of this.vowelList) {
                        if (plain.startsWith(v)) {
                            vowel = v;
                            final = plain.slice(v.length);
                            consonant = '';
                            remaining = plain;
                            break;
                        }
                    }
                }
                const consonantName = this.letterNames[consonant] || consonant;
                const vowelName = this.letterNames[vowel] || vowel;
                const finalName = this.letterNames[final] || final;
                let spellingParts = [];
                if (consonant) spellingParts.push(consonantName);
                if (vowel) spellingParts.push(vowelName);
                if (final) spellingParts.push(finalName);
                spellingParts.push(syllable);
                const spelling = spellingParts.join(' ... ');
                const toneName = this.toneNames[toneChar] || '平声';
                return {
                    original: syllable,
                    plain: plain,
                    consonant: consonant,
                    vowel: vowel,
                    final: final,
                    toneChar: toneChar,
                    toneName: toneName,
                    spelling: spelling,
                    consonantName: consonantName,
                    vowelName: vowelName,
                    finalName: finalName
                };
            }

            getSpellingText(syllable, separator = ' ... ') {
                const parsed = this.parse(syllable);
                const parts = [];
                if (parsed.consonant) parts.push(parsed.consonantName);
                if (parsed.vowel) parts.push(parsed.vowelName);
                if (parsed.final) parts.push(parsed.finalName);
                parts.push(syllable);
                return parts.join(separator);
            }
        }

                    "đờ a đa": "0402_đờ a đa.mp3",
                    "ơ": "0403_ơ.mp3",
                    "ơc": "0404_ơc.mp3",
                    "ơm": "0405_ơm.mp3",
                    "ơn": "0406_ơn.mp3",
                    "ơng": "0407_ơng.mp3",
                    "ơp": "0408_ơp.mp3",
                    "ơt": "0409_ơt.mp3",
                    "ư": "0410_ư.mp3",
                    "ưc": "0411_ưc.mp3",
                    "ưch": "0412_ưch.mp3",
                    "ưm": "0413_ưm.mp3",
                    "ưn": "0414_ưn.mp3",
                    "ưng": "0415_ưng.mp3",
                    "ưnh": "0416_ưnh.mp3",
                    "ưp": "0417_ưp.mp3",
                    "ưt": "0418_ưt.mp3"
                };
                this.isReady = true;
                document.getElementById('statusText').textContent =
                    `✅ 已加载 ${Object.keys(this.audioMapping).length} 个离线音频`;
                console.log('📦 离线音频映射表已硬编码加载');
            }

            speak(text, lang = 'vi') {
                if (!text || text.trim() === '') return;
                const key = text.trim();

                if (this.audioMapping[key]) {
                    return this._playFile(`audio/${this.audioMapping[key]}`);
                }

                const plain = key.normalize('NFD').replace(/[\u0300-\u036f]/g, '');
                if (this.audioMapping[plain]) {
                    return this._playFile(`audio/${this.audioMapping[plain]}`);
                }

                return this._fallbackTTS(key);
            }

            _playFile(url) {
                if (this.audioCache.has(url)) {
                    const audio = this.audioCache.get(url);
                    audio.currentTime = 0;
                    audio.play().catch(() => this._fallbackTTS(url));
                    return true;
                }

                const audio = new Audio(url);
                audio.oncanplaythrough = () => {
                    this.audioCache.set(url, audio);
                    audio.play().catch(() => this._fallbackTTS(url));
                };
                audio.onerror = () => {
                    console.warn('离线音频加载失败:', url);
                    this._fallbackTTS(url);
                };
                audio.load();
                return true;
            }

            _fallbackTTS(text) {
                if (!window.speechSynthesis) {
                    console.warn('浏览器不支持TTS');
                    return false;
                }
                window.speechSynthesis.cancel();
                const utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = 'vi-VN';
                utterance.rate = 0.85;
                utterance.pitch = 1;
                utterance.volume = 1;
                window.speechSynthesis.speak(utterance);
                return true;
            }

            speakSpelling(syllable, engine) {
                const spellingText = engine.getSpellingText(syllable);
                this.speak(spellingText);
                return true;
            }
        }

        // ============================================================
        // 5. 主应用
        // ============================================================
        class App {
            constructor() {
                this.engine = new SpellingEngine();
                this.tts = new OfflineAudioPlayer();
                this.favorites = JSON.parse(localStorage.getItem('viet_spelling_fav') || '[]');

                this.resultWord = document.getElementById('resultWord');
                this.resultSpelling = document.getElementById('resultSpelling');
                this.resultDetail = document.getElementById('resultDetail');
                this.searchInput = document.getElementById('searchInput');
                this.searchBtn = document.getElementById('searchBtn');
                this.randomBtn = document.getElementById('randomBtn');
                this.playBtn = document.getElementById('playBtn');

                this.currentSyllable = 'ba';

                this.init();
            }

            init() {
                this.searchBtn.addEventListener('click', () => this.handleSearch());
                this.searchInput.addEventListener('keydown', (e) => {
                    if (e.key === 'Enter') this.handleSearch();
                });
                this.randomBtn.addEventListener('click', () => this.handleRandom());
                this.playBtn.addEventListener('click', () => this.playCurrent());

                document.querySelectorAll('.tab-btn').forEach(btn => {
                    btn.addEventListener('click', () => {
                        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
                        document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
                        btn.classList.add('active');
                        document.getElementById(btn.dataset.tab).classList.add('active');
                    });
                });

                document.getElementById('clearFavBtn').addEventListener('click', () => {
                    if (confirm('确定清空所有收藏吗？')) {
                        this.favorites = [];
                        this.saveFavorites();
                        this.renderFavorites();
                        this.showToast('已清空收藏');
                    }
                });

                this.renderVowels();
                this.renderConsonants();
                this.renderCVGrid();
                this.renderToneGrid();
                this.renderFinalGrid();
                this.renderMinimalPairs();
                this.renderFavorites();

                this.showResult('ba');
            }

            renderVowels() {
                const container = document.getElementById('vowelGrid');
                let html = '';
                DATA.vowels.forEach(v => {
                    html += `<div class="phoneme-chip" data-text="${v}">${v}</div>`;
                });
                container.innerHTML = html;
                container.querySelectorAll('.phoneme-chip').forEach(el => {
                    el.addEventListener('click', () => {
                        const text = el.dataset.text;
                        this.tts.speak(text);
                        this.showToast(`🔊 ${text}`);
                    });
                });
            }

            renderConsonants() {
                const container = document.getElementById('consonantGrid');
                let html = '';
                DATA.consonants.forEach(c => {
                    const info = CONSONANT_MAP[c];
                    if (!info) return;
                    const displayName = info.display;
                    const ipa = info.ipa;
                    html += `<div class="phoneme-chip" data-text="${c}" data-ipa="${ipa}">
                                ${c}
                                <span class="sub">${displayName}</span>
                                <span class="ipa-badge">${ipa}</span>
                            </div>`;
                });
                container.innerHTML = html;
                container.querySelectorAll('.phoneme-chip').forEach(el => {
                    el.addEventListener('click', () => {
                        const text = el.dataset.text;
                        const ipa = el.dataset.ipa;
                        this.tts.speak(ipa);
                        this.showToast(`🔊 ${text} → ${ipa}`);
                    });
                });
            }

            handleSearch() {
                const text = this.searchInput.value.trim();
                if (!text) { this.showToast('请输入越南语音节'); return; }
                this.showResult(text);
            }

            handleRandom() {
                const allSyllables = this.getAllSyllables();
                if (allSyllables.length === 0) return;
                const random = allSyllables[Math.floor(Math.random() * allSyllables.length)];
                this.searchInput.value = random;
                this.showResult(random);
            }

            getAllSyllables() {
                const set = new Set();
                Object.values(DATA.cvTable).forEach(arr => arr.forEach(s => set.add(s)));
                Object.values(DATA.toneWords).forEach(arr => arr.forEach(s => set.add(s)));
                Object.values(DATA.finalTable).forEach(arr => arr.forEach(s => set.add(s)));
                DATA.vowels.forEach(v => set.add(v));
                DATA.consonants.forEach(c => set.add(c));
                return Array.from(set);
            }

            showResult(syllable) {
                this.currentSyllable = syllable;
                const parsed = this.engine.parse(syllable);

                this.resultWord.textContent = parsed.original;
                this.resultSpelling.textContent = parsed.spelling;

                let detail = `辅音: ${parsed.consonant || '无'} | 元音: ${parsed.vowel || '无'}`;
                if (parsed.final) detail += ` | 后辅音: ${parsed.final}`;
                detail += ` | 声调: ${parsed.toneName}`;
                this.resultDetail.textContent = detail;

                this.playCurrent();
            }

            playCurrent() {
                const text = this.currentSyllable;
                this.tts.speakSpelling(text, this.engine);
                this.playBtn.textContent = '🔊 播放中...';
                this.playBtn.disabled = true;
                setTimeout(() => {
                    this.playBtn.textContent = '🔊 播放拼读';
                    this.playBtn.disabled = false;
                }, 2000);
            }

            toggleFavorite(syllable) {
                const idx = this.favorites.indexOf(syllable);
                if (idx > -1) { this.favorites.splice(idx, 1); } else { this.favorites.push(syllable); }
                this.saveFavorites();
                this.renderFavorites();
                this.renderCVGrid();
                this.renderToneGrid();
                this.renderFinalGrid();
                this.renderMinimalPairs();
                this.showToast(idx > -1 ? `已移除 ${syllable}` : `已收藏 ${syllable}`);
            }

            isFavorite(syllable) { return this.favorites.includes(syllable); }

            saveFavorites() { localStorage.setItem('viet_spelling_fav', JSON.stringify(this.favorites)); }

            showToast(msg) {
                const el = document.getElementById('toast');
                el.textContent = msg;
                el.classList.add('show');
                clearTimeout(this.toastTimer);
                this.toastTimer = setTimeout(() => el.classList.remove('show'), 1500);
            }

            renderCVGrid() {
                const container = document.getElementById('cvGrid');
                let html = '';
                for (const [consonant, syllables] of Object.entries(DATA.cvTable)) {
                    html += `<div style="grid-column:1/-1; font-weight:600; color:#1a73e8; font-size:13px; padding:4px 0;">${consonant}</div>`;
                    syllables.forEach(s => {
                        const fav = this.isFavorite(s) ? '⭐' : '☆';
                        html += `<div class="syllable-chip" data-syllable="${s}">${s}<span class="fav-btn" data-syllable="${s}">${fav}</span></div>`;
                    });
                }
                container.innerHTML = html;
                this.bindChipEvents(container);
            }

            renderToneGrid() {
                const container = document.getElementById('toneGrid');
                let html = '';
                for (const [base, tones] of Object.entries(DATA.toneWords)) {
                    html += `<div style="grid-column:1/-1; font-weight:500; color:#64748b; font-size:13px; padding:4px 0;">${base}</div>`;
                    tones.forEach(s => {
                        const fav = this.isFavorite(s) ? '⭐' : '☆';
                        html += `<div class="syllable-chip" data-syllable="${s}">${s}<span class="fav-btn" data-syllable="${s}">${fav}</span></div>`;
                    });
                }
                container.innerHTML = html;
                this.bindChipEvents(container);
            }

            renderFinalGrid() {
                const container = document.getElementById('finalGrid');
                let html = '';
                for (const [vowel, finals] of Object.entries(DATA.finalTable)) {
                    html += `<div style="grid-column:1/-1; font-weight:500; color:#64748b; font-size:13px; padding:4px 0;">${vowel}</div>`;
                    finals.forEach(s => {
                        const fav = this.isFavorite(s) ? '⭐' : '☆';
                        html += `<div class="syllable-chip" data-syllable="${s}">${s}<span class="fav-btn" data-syllable="${s}">${fav}</span></div>`;
                    });
                }
                container.innerHTML = html;
                this.bindChipEvents(container);
            }

            renderMinimalPairs() {
                const container = document.getElementById('minimalList');
                let html = '';
                DATA.minimalPairs.forEach((pair) => {
                    const [w1, zh1, w2, zh2] = pair;
                    const fav1 = this.isFavorite(w1) ? '⭐' : '☆';
                    const fav2 = this.isFavorite(w2) ? '⭐' : '☆';
                    html += `<div class="minimal-pair">
                                <div class="pair-item">
                                    <span class="pair-word" data-syllable="${w1}">${w1}</span>
                                    <span class="pair-zh">${zh1}</span>
                                    <button class="pair-play" data-syllable="${w1}">🔊</button>
                                    <span class="fav-btn" data-syllable="${w1}">${fav1}</span>
                                </div>
                                <div style="color:#94a3b8; font-size:18px;">⇄</div>
                                <div class="pair-item">
                                    <span class="pair-word" data-syllable="${w2}">${w2}</span>
                                    <span class="pair-zh">${zh2}</span>
                                    <button class="pair-play" data-syllable="${w2}">🔊</button>
                                    <span class="fav-btn" data-syllable="${w2}">${fav2}</span>
                                </div>
                            </div>`;
                });
                container.innerHTML = html;
                container.querySelectorAll('.pair-word').forEach(el => {
                    el.addEventListener('click', () => {
                        const s = el.dataset.syllable;
                        this.searchInput.value = s;
                        this.showResult(s);
                    });
                });
                container.querySelectorAll('.pair-play').forEach(el => {
                    el.addEventListener('click', (e) => {
                        e.stopPropagation();
                        const s = el.dataset.syllable;
                        this.tts.speak(s);
                        this.showToast(`🔊 ${s}`);
                    });
                });
                container.querySelectorAll('.fav-btn').forEach(el => {
                    el.addEventListener('click', (e) => {
                        e.stopPropagation();
                        const s = el.dataset.syllable;
                        this.toggleFavorite(s);
                    });
                });
            }

            renderFavorites() {
                const container = document.getElementById('favoritesList');
                if (this.favorites.length === 0) {
                    container.innerHTML = '<p style="color:#94a3b8; font-size:14px; text-align:center; padding:20px 0;">暂无收藏</p>';
                    return;
                }
                let html = '<div class="syllable-grid">';
                this.favorites.forEach(s => {
                    html += `<div class="syllable-chip" data-syllable="${s}">${s}<span class="fav-btn" data-syllable="${s}">⭐</span></div>`;
                });
                html += '</div>';
                container.innerHTML = html;
                this.bindChipEvents(container);
            }

            bindChipEvents(container) {
                container.querySelectorAll('.syllable-chip').forEach(el => {
                    el.addEventListener('click', (e) => {
                        if (e.target.classList.contains('fav-btn')) return;
                        const s = el.dataset.syllable;
                        this.searchInput.value = s;
                        this.showResult(s);
                    });
                    const favBtn = el.querySelector('.fav-btn');
                    if (favBtn) {
                        favBtn.addEventListener('click', (e) => {
                            e.stopPropagation();
                            const s = favBtn.dataset.syllable;
                            this.toggleFavorite(s);
                        });
                    }
                });
            }
        }

        document.addEventListener('DOMContentLoaded', () => {
            const app = new App();
            window.app = app;
        });
    </script>
